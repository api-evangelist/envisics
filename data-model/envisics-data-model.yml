not_exposed:
- name: timeline-awesome
  reason: >-
    A custom post type present in the site sitemap (https://envisics.com/timeline-awesome-sitemap.xml)
    but NOT registered on the REST API — no /wp/v2/timeline-awesome route exists in the route index
    and it is absent from /wp/v2/types. The company-history timeline is therefore readable as HTML
    but not through the API.
- name: feedback / jp_pay_order / jp_pay_product / elementor_*
  reason: >-
    Registered types that are plugin scaffolding (Gravity Forms responses, Jetpack payments,
    Elementor templates) rather than Envisics content, and are not anonymously readable.
