    body: '{"code":"rest_post_invalid_id","message":"Invalid post ID.","data":{"status":404}}'
  remediation: List the collection first and use an id returned by it.
  applies_to:
  - openapi/envisics-posts-api-openapi.yml#getPost
  - openapi/envisics-pages-api-openapi.yml#getPage
  - openapi/envisics-media-api-openapi.yml#getMediaItem
- status: 404
  code: rest_term_invalid
  title: Invalid term ID
  detail: No category or tag term matches the supplied identifier.
  remediation: List the taxonomy collection and use a returned term id.
  applies_to:
  - openapi/envisics-taxonomy-api-openapi.yml#getCategory
  - openapi/envisics-taxonomy-api-openapi.yml#getTag
- status: 404
  code: rest_no_route
  title: No route
  detail: No handler is registered for the requested path and method.
  remediation: Check the route index at https://envisics.com/wp-json/ for the registered paths.
- status: 401
  code: rest_forbidden
  title: Authentication required
  detail: The route is not part of the anonymous surface and requires credentials.
  observed:
    request: GET https://envisics.com/wp-json/wp/v2/settings
    status: 401
  remediation: >-
    Not reachable by third parties. Envisics issues no API credentials; these routes are for site
    operators using WordPress application passwords.
- status: 403
  code: rest_cookie_invalid_nonce
  title: Invalid nonce
  detail: A cookie-authenticated request supplied a missing or stale X-WP-Nonce.
  remediation: Not applicable to anonymous integrators.
- status: 500
  title: Server error
  detail: >-
    Not observed during probing on 2026-08-12. Recorded because the origin (nginx) can return
    generic 5xx responses that are NOT wrapped in the WordPress JSON envelope; treat a non-JSON body
    on a 5xx as expected and retry with backoff.
