aid: envisics
name: Envisics
description: >-
  Envisics is a British deep-technology company headquartered in Milton Keynes, United Kingdom, that
  pioneers dynamic holography for automotive augmented-reality head-up displays (AR HUD). The work
  began with Dr Jamieson Christmas' PhD at Cambridge University in 2004, continued through Two Trees
  Photonics (founded 2010, acquired by DAQRI in 2015) which built the world's first laser holographic
  HUD for Jaguar Land Rover, and was spun out as the independent company Envisics on 1 January 2018.
  Its Dynamic Holography Platform and next-generation Holographic Waveguide Technology combine
  proprietary algorithms with simpler, fewer and more robust optics to deliver multi-plane AR imagery
  at under 10% of the optical power of conventional systems; first-generation technology shipped in
  over 150,000 Jaguar and Land Rover vehicles and second-generation technology was slated for the
  Cadillac LYRIQ-V and 2026 Cadillac VISTIQ. Investors included Hyundai Mobis, General Motors
  Ventures, Stellantis, InMotion Ventures (Jaguar Land Rover) and Tarsadia Investments. Envisics is
  an automotive hardware and optics supplier rather than a software vendor: it publishes no
  commercial or developer-facing product API, no developer portal, and no SDKs. The only
  machine-readable interface it exposes is the WordPress REST content API behind its corporate
  website at envisics.com, captured here for discovery purposes and anonymously readable but
  read-only. Envisics Ltd. entered administration on 22 April 2026 under the Insolvency Act 1986,
  with Geoff Rowley and Simon Carvill-Biggs of FRP Advisory Trading Limited appointed as Joint
  Administrators.
